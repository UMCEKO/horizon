name: boat-smoke
# A manual check that boat's runners take this repository's jobs (see vars.BOAT_CI in dyna-ci.yml).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: boat-large
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "runner: $RUNNER_NAME environment: ${{ runner.environment }}"
          nproc; free -g; df -h "$GITHUB_WORKSPACE" | tail -1
          sudo -n true && echo "sudo: yes"
