name: claim
# A comment of `/claim` on an open issue assigns the commenter and swaps `help wanted` for `claimed`;
# `/unclaim` releases it and swaps them back.
# The board's hourly sweep turns an assignee into Status Claimed with that Owner.
on:
  issue_comment:
    types: [created]
permissions:
  issues: write
jobs:
  claim:
    if: ${{ !github.event.issue.pull_request && github.event.issue.state == 'open' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Agents prefix their comments with the disclosure line `🤖 Agent:`; the command follows it.
            const body = context.payload.comment.body.trim().replace(/^🤖\s*Agent:\s*/u, '');
            const who = context.payload.comment.user.login;
            const issue = context.payload.issue;
            const ref = { owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number };
            const holders = issue.assignees.map(a => a.login);
            if (/^\/claim\b/i.test(body)) {
              if (holders.length && !holders.includes(who)) {
                await github.rest.issues.createComment({ ...ref, body: `@${who} this is already claimed by @${holders.join(', @')}. Comment on the issue to coordinate.` });
                return;
              }
              await github.rest.issues.addAssignees({ ...ref, assignees: [who] });
              await github.rest.issues.addLabels({ ...ref, labels: ['claimed'] });
              await github.rest.issues.removeLabel({ ...ref, name: 'help wanted' }).catch(() => {});
              await github.rest.reactions.createForIssueComment({ owner: ref.owner, repo: ref.repo, comment_id: context.payload.comment.id, content: '+1' });
            } else if (/^\/unclaim\b/i.test(body) && holders.includes(who)) {
              await github.rest.issues.removeAssignees({ ...ref, assignees: [who] });
              if (holders.length === 1) {
                await github.rest.issues.removeLabel({ ...ref, name: 'claimed' }).catch(() => {});
                await github.rest.issues.addLabels({ ...ref, labels: ['help wanted'] });
              }
              await github.rest.reactions.createForIssueComment({ owner: ref.owner, repo: ref.repo, comment_id: context.payload.comment.id, content: '+1' });
            }
