name: roadmap-progress
# Redraws the progress bars in the pinned roadmap issue #771 from the board
# (.github/scripts/roadmap-progress.js). Needs PROJECT_TOKEN (Projects read on the arismoko account); the
# issue edit uses the workflow's own token; skipped without it. Checks out no PR code.
on:
  issues:
    types: [opened, closed, reopened]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: roadmap-progress
  cancel-in-progress: false
jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - id: token
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: '[ -n "$PROJECT_TOKEN" ] && echo set=1 >> "$GITHUB_OUTPUT" || echo "::notice::PROJECT_TOKEN is not set; progress skipped."'
      # Let the board sync for the same event place the issue first.
      - if: steps.token.outputs.set && github.event_name == 'issues'
        run: sleep 90
      - if: steps.token.outputs.set
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
      - if: steps.token.outputs.set
        uses: actions/github-script@v7
        env:
          ISSUES_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            await require('./.github/scripts/roadmap-progress.js')({ github, issues: new github.constructor({ auth: process.env.ISSUES_TOKEN }), core })
