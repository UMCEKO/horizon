[package]
name = "horizon-assets"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Horizon version-specific model and resource decoding"

[dependencies]
horizon-core = { path = "../horizon-core" }
log = "0.4"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["raw_value"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
miniz_oxide = "0.8"
png = "0.18"
