[package]
name = "horizon-bench"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"
description = "The benchmark report format (docs/benchmark-report.md), shared by the game and the launcher"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local probes are excluded from the reader's WASM build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
horizon-system = { path = "../horizon-system" }
