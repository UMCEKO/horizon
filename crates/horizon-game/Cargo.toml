[package]
name = "horizon-game"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The game as the platform runs it: the engine's entry with the platform's parts registered, for an executable to start (docs/layers.md)"

[dependencies]
horizon-client = { path = "../horizon-client" }
horizon-threads = { path = "../horizon-threads" }
horizon-mod-package = { path = "../horizon-mod-package", default-features = false, features = ["index"] }

[features]
# Real Java mods in an embedded JVM (docs/java-mods.md).
java-mods = ["horizon-client/java-mods"]

[lints]
workspace = true
