[package]
name = "horizon-java-analysis"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Which vanilla behaviours the mods of a Java mods run folder change, read from their jars (docs/java-mods.md)"

[[bin]]
name = "horizon-java-analysis"
path = "src/main.rs"

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
toml = "1.1.6"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true
