[package]
name = "point-record-wire-fixture"
version = "0.0.0"
edition = "2024"
publish = false

# Separate workspace: the API generator itself depends on point-shape.
[workspace]

[features]
wasm-guest = ["mod_api/wasm-guest"]

[dependencies]
mod_api = { package = "horizon-mod-api", path = "../../../horizon-mod-api" }

[build-dependencies]
point_shape = { package = "horizon-mod-point-shape", path = "../.." }
syn = { version = "2", features = ["full"] }
quote = "1"
