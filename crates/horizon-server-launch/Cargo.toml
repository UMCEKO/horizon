[package]
name = "horizon-server-launch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Shared server configuration, installation layout and dedicated-engine commands"

[dependencies]
horizon-platform = { path = "../horizon-platform", features = ["server-files"] }
horizon-server-files = { path = "../horizon-server-files" }
horizon-anticheat = { path = "../horizon-anticheat" }
horizon-chat-filter = { path = "../horizon-chat-filter" }
horizon-core = { path = "../horizon-core" }
dunce = "1.0.5"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
toml_edit = "0.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[lints]
workspace = true
