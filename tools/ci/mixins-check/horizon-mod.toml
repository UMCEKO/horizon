# CI's slot/source check: tools/ci/mixins_check.sh pins the game and fills the
# function hashes and the Game declaration, including an area-file method, from the generated catalog.
id = "mixins_check"
name = "Mixins check"
version = "0.1.0"
description = "CI: unified API and area slots plus native internals source routing"
authors = []
api = "0.2"
side = "both"
capabilities = ["registries"]

internals = [{ path = "horizon_client::game::Game", hash = "GAME_HASH" }]

[native]
game = "26.3"
horizon = "HEAD"
mixins = "d9c83d7096b7ea5b83678da2efdfd6161f74997e"

[[inject]]
id = "tick"
at = "horizon_client::game::Game<'_>::tick"
kind = "head"
with = "tick"
hash = "TICK_HASH"

[[inject]]
id = "count"
at = "horizon_client::game::Game<'_>::tick_mobs"
kind = "head"
with = "count"
access = "internals"
hash = "COUNT_HASH"

[[inject]]
id = "area"
at = "horizon_client::game::using_item::Game<'_>::start_eating"
kind = "return"
with = "area"
access = "internals"
hash = "AREA_HASH"
