# The regression refreshes fingerprints and the source revision in its disposable copy.
id = "native_slot_order"
name = "Native slot order regression"
version = "0.1.0"
api = "0.2"
side = "both"
capabilities = ["registries"]
inject = [
    { id = "low", at = "horizon_client::game::Game<'_>::on_tick_rate_changed", kind = "return", with = "low", access = "internals", priority = 0, hash = "0000000000000000" },
    { id = "high", at = "horizon_client::game::Game<'_>::on_tick_rate_changed", kind = "return", with = "high", access = "internals", priority = 10, hash = "0000000000000000" },
    { id = "head", at = "horizon_client::game::Game<'_>::on_tick_rate_changed", kind = "head", with = "head", access = "internals", hash = "0000000000000000" },
    { id = "value", at = "horizon_client::game::Game<'_>::next_autosave_interval", kind = "modify_value", with = "value", access = "internals", hash = "0000000000000000", call = "horizon_client::game::autosave_interval", nth = 0, ctx = "0000000000000000" },
    { id = "wrap", at = "horizon_client::game::Game<'_>::on_tick_rate_changed", kind = "wrap_call", with = "wrap", access = "internals", hash = "0000000000000000", call = "horizon_client::game::Game::next_autosave_interval", nth = 0, ctx = "0000000000000000" },
    { id = "api_head", at = "horizon_client::game::Game<'_>::on_tick_rate_changed", kind = "head", with = "api_head", priority = -10, hash = "0000000000000000" },
    { id = "api_return", at = "horizon_client::game::Game<'_>::next_autosave_interval", kind = "return", with = "api_return", priority = 3, hash = "0000000000000000" },
]

internals = [{ path = "horizon_client::game::Game", hash = "0000000000000000" }, { path = "horizon_client::game::Game<'_>::ticks_until_autosave", hash = "0000000000000000" }]

[native]
game = "26.3"
horizon = "0000000000000000000000000000000000000000"
mixins = "0000000000000000000000000000000000000000"
